services:
  1mate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: 1mate:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - 1mate-data:/data
    environment:
      ONEMATE_ADDR: 0.0.0.0:8080
      ONEMATE_DATA_DIR: /data
      ONEMATE_LOG_LEVEL: info
      # Set when serving behind a TLS proxy.
      # ONEMATE_SECURE_COOKIE: "true"

volumes:
  1mate-data:
